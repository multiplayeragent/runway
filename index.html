<style>

<script type="module">

 * walks the runway and strikes a pose while everyone else rates the look 1–5 stars. Best

 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host

 *                   star tally. Only the host writes these.

 *     host reads everyone's ratings when each walk ends and adds them up.

// ── CONNECTION ──────────────────────────────────────────────────────────────────────

  key: 'pk_REPLACE_ME',

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

const renderer = new THREE.WebGLRenderer({ antialias: true });

// Drag on the dressing room to turn your model.
let spinVel = 0, dragX = null;
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
renderer.domElement.addEventListener("pointerdown", (e) => { e.preventDefault(); dragX = e.clientX; });
renderer.domElement.addEventListener("pointermove", (e) => { if (dragX !== null) { spinVel = (e.clientX - dragX) * 0.01; me.spin += spinVel; dragX = e.clientX; } });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) renderer.domElement.addEventListener(ev, () => { dragX = null; });
me.spin = 0;

// ── SOUND ───────────────────────────────────────────────────────────────────────────
let AC = null, master = null, noise = null, nextBeat = 0, beatNo = 0;
function unlockAudio() {
  if (AC || ATTRACT) return;
  try {
    AC = new AudioContext(); master = AC.createGain(); master.gain.value = 0.45; master.connect(AC.destination);
    noise = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch { AC = null; }
}
function tone(f, len, type, vol, f2, at = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + len);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len); o.connect(g).connect(master); o.start(t0); o.stop(t0 + len + 0.05);
}
function hiss(len, vol, hp, at = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + at, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noise; f.type = "highpass"; f.frequency.value = hp; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len); s.connect(f).connect(g).connect(master); s.start(t0, Math.random() * 0.5); s.stop(t0 + len + 0.02);
}
const click = () => tone(1400, 0.06, "triangle", 0.12, 900);
const shutter = () => { hiss(0.05, 0.25, 3000); hiss(0.04, 0.2, 5000, 0.07); };
const applause = () => { for (let i = 0; i < 40; i++) hiss(0.06, 0.08 + Math.random() * 0.08, 1500 + Math.random() * 3000, Math.random() * 2.2); };
/** The runway beat: kick, hats and a bass line at 120 BPM, scheduled a step ahead. Softer chords in the dressing room. */
function music(r, now) {
  if (!AC || !r) return;
  if (now < nextBeat) return;
  nextBeat = now + 250; beatNo++;
  const s = beatNo % 16, bass = [41, 41, 48, 46][Math.floor(beatNo / 16) % 4];
  if (r.phase === "walk" || r.phase === "podium") {
    if (s % 4 === 0) tone(140, 0.25, "sine", 0.8, 45);
    if (s % 4 === 2) hiss(0.04, 0.12, 7000);
    if (s % 8 === 4) hiss(0.12, 0.2, 1200);
    if (s % 2 === 0) tone(440 * Math.pow(2, (bass - 69) / 12), 0.2, "sawtooth", 0.06, 0);
  } else if (r.phase === "dress" && s % 8 === 0) for (const x of [0, 4, 7, 11]) tone(440 * Math.pow(2, (bass + 24 + x - 69) / 12), 1.8, "sine", 0.03, 0);
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, prev = null, lastSendO = 0;
const camPos = new THREE.Vector3(0, 3, 8), camLook = new THREE.Vector3(0, 1, -4), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
/** Where the walking model is at time `t` into its walk: out to the front, pose, back to its spot in the line. */
function walkPath(k, spot) {
  const W = CONFIG.walkMs, out = 0.43, pose = 0.3; // shares of the walk
  if (k < out) { const e = k / out; return { x: 0, z: RUN_BACK + (RUN_FRONT - RUN_BACK) * e, h: 0, mode: "walk" }; }
  if (k < out + pose) return { x: 0, z: RUN_FRONT, h: 0, mode: "pose", pk: (k - out) / pose };
  const e = (k - out - pose) / (1 - out - pose);
  return { x: spot.x * e, z: RUN_FRONT + (spot.z - RUN_FRONT) * e, h: Math.PI, mode: "walk" };
}
/** Spot n in the line of models standing at the back of the stage after their walk. */
const lineSpot = (n, of) => ({ x: (n - (of - 1) / 2) * 1.05, z: -11.6 });
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (realNow - lastTick > 1000) { hostHold = realNow + 700; host.was = false; host.last = null; } // woke from a freeze or a background tab: let the newer state arrive, then adopt it like a new host
  lastTick = realNow;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)), t = now / 1000; last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  if (isHost()) hostTick(now); else host.was = false;
  const r = showState();
  if (!r) { renderer.render(scene, camera); return; }
  if (me.showId !== r.id) { me.showId = r.id; me.rate = { r: r.id, s: {} }; prev = null; }
  autopilot(r, now);
  const theme = THEMES[r.th]; paintBackdrop(theme);
  const inRoom = r.phase === "dress";
  room.visible = inRoom; show.visible = !inRoom; podium.visible = r.phase === "podium";
  const seen = new Set();
  let hype = 0.2;
  if (inRoom) { // the dressing room: just you on the turntable
    const m = modelOf("me"); seen.add("me"); dress(m, me.o);
    me.spin += dragX === null ? dt * 0.5 : 0;
    m.g.position.set(DR.x, 0.18, DR.z); m.g.rotation.y = me.spin; animate(m, t, me.tab === "pose" ? "pose" : "idle", ((t * 1000) % 2400) / 2400, me.o.p); // on the Pose tab, strike it
    placeTag(m, "", "#fff", false);
    const tall = camera.aspect < 0.9, panel = !ATTRACT && touchUI || innerWidth <= 760;
    wantPos.set(DR.x + (panel || ATTRACT ? 0 : 0.9), tall ? 1.6 : 1.3, DR.z + (tall ? 5.9 : ATTRACT ? 3.1 : 3.9)); wantLook.set(DR.x + (panel || ATTRACT ? 0 : 0.9), tall ? (panel ? 0.35 : 0.95) : ATTRACT ? 1.08 : 1.15, 0);
  } else {
    // Everyone in the walk order: the one walking now, the ones who walked (in the line at the back), the rest waiting off-stage.
    const order = r.phase === "walk" || r.phase === "podium" ? r.order : [], k = r.phase === "walk" ? Math.min(1, (Date.now() - r.at) / CONFIG.walkMs) : 1;
    order.forEach(([id, name, color], n) => {
      const look = who(r, id); if (!look || !validOutfit(look.o)) return;
      const m = modelOf(id); seen.add(id); dress(m, look.o);
      let pos, mode = "idle", pk = 0, label = "";
      const podiumPlace = r.phase === "podium" ? (r.res || []).findIndex((x) => x[0] === id) : -1;
      if (podiumPlace >= 0 && podiumPlace < 3) { const p = PODIUM[podiumPlace]; pos = { x: p.x, y: RUN_Y + p.h, z: -10.6, h: 0 }; mode = podiumPlace === 0 ? "pose" : "idle"; pk = ((t * 1000) % 2400) / 2400; label = `${["🥇", "🥈", "🥉"][podiumPlace]} ${id === net.sessionId ? "You" : name}`; }
      else if (r.phase === "walk" && n === r.i) { const w = walkPath(k, lineSpot(n, order.length)); pos = { ...w, y: RUN_Y }; mode = w.mode; pk = w.pk || 0; label = id === net.sessionId ? "You" : name; hype = mode === "pose" ? 1 : 0.6; }
      else if (r.phase === "podium" || n < r.i) { const s = lineSpot(n, order.length); pos = { x: s.x, y: RUN_Y, z: s.z - (r.phase === "podium" ? 1.2 : 0), h: 0 }; }
      else pos = { x: 0, y: -20, z: -30, h: 0 }; // waiting backstage
      m.g.position.set(pos.x, pos.y, pos.z); m.g.rotation.y = pos.h;
      animate(m, t, mode, pk, look.o.p);
      placeTag(m, label, color, !!label && !ATTRACT);
    });
    if (r.phase === "podium") hype = 0.8;
  }
  for (const [id, m] of models) if (!seen.has(id)) { m.g.visible = false; m.tag.style.display = "none"; } else m.g.visible = true;
  // One-off effects from what changed in state: a new model on the runway, their stars, the winner.
  if (prev && prev.id === r.id) {
    if (r.phase === "walk" && prev.phase === "walk" && r.i !== prev.i) { const p = r.order[prev.i], s = r.sc[p && p[0]]; if (p && s && !ATTRACT) toast(`${p[0] === net.sessionId ? "You" : p[1]}: ★ ${avgOf(s).toFixed(1)}`); }
    if (r.phase === "podium" && prev.phase !== "podium") { burst(0, 3, -10.6, 160, 8); applause(); }
    if (r.phase !== prev.phase) beatNo = 0;
  }
  if (r.phase === "walk") { const k = (Date.now() - r.at) / CONFIG.walkMs; if (k > 0.43 && k < 0.73 && Math.random() < dt * 9) { popFlash(1 + Math.floor(Math.random() * 2)); if (Math.random() < 0.5) shutter(); } }
  if (r.phase === "podium" && Math.random() < dt * 3) { burst((Math.random() - 0.5) * 4, 4, -10.6, 6, 4); popFlash(1); }
  prev = r;
  // Camera: the dressing room, or the end of the runway following the model.
  if (!inRoom) {
    const tall = camera.aspect < 0.9, cur = r.phase === "walk" ? models.get(r.order[r.i]?.[0]) : null;
    if (r.phase === "podium") { const side = tall ? 0 : 1.7; wantPos.set(side, tall ? 3.6 : 3.3, tall ? 2 : -4.2); wantLook.set(side, tall ? 0.2 : 2.4, -10.6); } // (a tall phone looks from further back, so the podium sits above the card) // on wide screens the podium sits left of the results card
    else if (cur) { const z = cur.g.position.z; wantPos.set(tall ? 0 : 1.6, 2.1, Math.max(z + (tall ? 6.5 : 4.6), -3)); wantLook.set(0, 1.4, z); }
    else { wantPos.set(0, 3.2, tall ? 9 : 7.5); wantLook.set(0, 2.2, -10); }
  }
  const jump = camPos.distanceTo(wantPos) > 25;
  camPos.lerp(wantPos, jump ? 1 : 1 - Math.pow(0.05, dt)); camLook.lerp(wantLook, jump ? 1 : 1 - Math.pow(0.03, dt));
  camera.position.copy(camPos); camera.lookAt(camLook);
  spot.target.position.copy(camLook).setY(RUN_Y); spot.position.set(camLook.x, 9, camLook.z + 5);
  washA.intensity = 20 + Math.sin(t * 4) * 8 * hype; washB.intensity = 20 + Math.cos(t * 4) * 8 * hype;
  animateFans(t, hype); animateConfetti(dt);
  for (const f of flashes) { f.life -= dt; f.s.material.opacity = Math.max(0, f.life * 4); }
  music(r, now);
  renderer.render(scene, camera);
  if (now - lastHud > 150) { lastHud = now; hud(r); fixColor(); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { netDown = true; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botList(showState()).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now(), o: JSON.stringify(me.o) });
  if (QS.has("test")) window.__test = { showState, me, isHost, host, who, rate, choose, setReady };
  requestAnimationFrame(frame);
})();
